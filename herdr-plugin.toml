id = "ghostty-tab-title"
name = "Ghostty tab title"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Shows color-coded agent status counts (blocked / done / working / idle) in the Ghostty tab title."
platforms = ["linux", "macos"]

# Long-lived watcher. Starts detached and returns immediately, so it never
# blocks herdr's startup sequence. Requires herdr >= 0.8.0; 0.7.x ignores
# [[startup]], which is what the event hooks below cover.
[[startup]]
command = ["python3", "bin/herdr-ghostty-title", "start"]

# Bootstrap on 0.7.x and self-heal everywhere. `ensure` exits in milliseconds
# when a watcher already holds the lock, so these are cheap. Only low-frequency
# events are used: panes/tabs/workspaces appearing, never focus or output.
[[events]]
on = "pane.created"
command = ["python3", "bin/herdr-ghostty-title", "ensure"]

[[events]]
on = "tab.created"
command = ["python3", "bin/herdr-ghostty-title", "ensure"]

[[events]]
on = "workspace.created"
command = ["python3", "bin/herdr-ghostty-title", "ensure"]

[[actions]]
id = "start"
title = "Ghostty title: start watcher"
command = ["python3", "bin/herdr-ghostty-title", "start"]

[[actions]]
id = "stop"
title = "Ghostty title: stop watcher"
command = ["python3", "bin/herdr-ghostty-title", "stop"]

[[actions]]
id = "restart"
title = "Ghostty title: restart watcher"
command = ["python3", "bin/herdr-ghostty-title", "restart"]

[[actions]]
id = "status"
title = "Ghostty title: watcher status"
command = ["python3", "bin/herdr-ghostty-title", "status"]

[[actions]]
id = "refresh"
title = "Ghostty title: refresh once"
command = ["python3", "bin/herdr-ghostty-title", "once"]
